services:
  - type: web
    name: haircare-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: haircare-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@haircare.com
      - key: DEFAULT_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: haircare-db
    plan: starter
